# 默认 Boss 模板配置文件
# 可在此文件中定义多个 Boss 组，每个组包含一个 Boss 的基本属性

# 示例 Boss 组：烈焰猴
blaze_ape:
  # 宝可梦种类（Cobblemon 模组中的物种名）
  cobblemon_species: "blaze_ape"
  # 生命值（整数）
  hp: 500
  # 攻击力（整数）
  attack: 40
  # 仇恨范围（方块数）
  aggro_range: 32
  # 脱战范围（方块数）
  deaggro_range: 48
  # 回血速率（每秒回血点数）
  heal_rate: 2.0
  # 自定义攻击类型：melee（近战）/ ranged（远程）
  attack_type: "melee"
  # 攻击范围（方块数，近战有效）
  attack_range: 3.0
  # 远程子弹类型（当 attack_type 为 ranged 时有效，如 "evoker_fangs"、"fireball"）
  projectile_type: "evoker_fangs"
  # 移动速度（倍数，1.0 为默认）
  speed: 1.3
  # 最小个体值 V 数（0~6，个体值 >=31 视为 V）
  min_ivs_count: 3
  # 进入视野时显示的标题文本（支持颜色代码 §）
  title: "§e§l烈焰猴 §e出现了！"
  # 重生时间（分钟）
  respawn_time_minutes: 10.0
  # 奖励：按排名执行的命令列表（第一名开始）
  # 命令中可使用 {player} 表示玩家名
  rewards:
    # 第一名
    1:
      - "give {player} diamond 16"
      - "cobblemon:give_pokemon {player} blaze_ape level:50 shiny:true"
    # 第二名
    2:
      - "give {player} diamond 8"
      - "cobblemon:give_pokemon {player} blaze_ape level:40"
    # 第三名
    3:
      - "give {player} diamond 4"
    # 参与奖（其他玩家）
    participation:
      - "give {player} iron_ingot 8"