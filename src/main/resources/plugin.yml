name: Demo
version: 1.0
main: com.tahai.Main
api-version: 1.21
commands:
  coin:
    description: 管理玩家金币（查询/给予/扣除/设置）
    usage: |
      /coin [玩家] - 查询金币
      /coin give <玩家> <数量> - 给予金币
      /coin take <玩家> <数量> - 扣除金币
      /coin set <玩家> <数量> - 设置金币
    permission: coin.admin
permissions:
  coin.admin:
    description: 允许使用 give/take/set 子命令
    default: op
  coin.use:
    description: 允许查询自己的金币
    default: true
author: "§eTAHAI§r"
