name: RandomFishingLoot
version: 1.0.0
main: com.tahai.randomfishingloot.RandomFishingLoot
api-version: 1.21

commands:
  rfishing:
    description: Main command for RandomFishingLoot
    usage: /<command> [reload|give]

permissions:
  randomfishing.reload:
    description: Allows reloading the plugin configuration
    default: op
  randomfishing.give:
    description: Allows giving fishing loot items
    default: op
author: "§eTAHAI§r"
