# 插件配置文件
# 钻石矿石在矿区矿石中的百分比（0.0-100.0）
diamond-percentage: 5.0

# 矿区倒计时提前提醒的秒数（例如矿区生成前60秒开始提醒）
countdown-seconds: 60

# 矿区坐标广播间隔秒数（如每10秒广播一次矿区位置）
broadcast-interval: 10

# 消息模板，支持占位符：{矿区名} {时间} {坐标} {剩余时间} 等
messages:
  # 矿区生成公告
  mining-area-announce: "§e§l[矿区]§7 新的矿区 §e{矿区名} §7已生成！坐标：§7{坐标}"
  # 倒计时提醒（每隔countdown-interval秒提示剩余时间）
  countdown-reminder: "§e§l[矿区]§7 矿区 §e{矿区名} §7将于 §7{剩余时间} §7秒后出现！"
  # 矿区已开放提示
  mining-area-open: "§e§l[矿区]§7 矿区 §e{矿区名} §7已开放，坐标：§7{坐标} §7，快去挖钻石吧！"
  # 坐标广播（每个广播间隔发送）
  coordinate-broadcast: "§e§l[矿区]§7 矿区 §e{矿区名} §7坐标：§7{坐标} §7（剩余时间：§e{剩余时间}§7）"
  # 玩家进入矿区提示
  player-enter: "§e§l[矿区]§7 你已进入矿区 §e{矿区名}§7，钻石矿石占比 §7{百分比}% §7！"