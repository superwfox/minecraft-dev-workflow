# AuthWeb 配置文件

# 数据库配置
database:
  # 数据库类型: sqlite 或 mysql
  type: sqlite
  # SQLite 数据库文件路径（相对于插件数据文件夹）
  sqlite-file: authweb.db
  # MySQL 连接信息（type 为 mysql 时生效）
  mysql:
    host: localhost
    port: 3306
    database: authweb
    username: root
    password: ""
    # MySQL 连接额外参数
    use-ssl: false

  # 数据库表前缀
  table-prefix: aw_

# HTTP 服务器配置
http:
  # HTTP 服务器监听端口
  port: 8080
  # 会话超时时间（分钟）
  session-timeout: 30

# 模组配置
mod:
  # 模组数据存储目录（相对于插件数据文件夹）
  storage-dir: mods